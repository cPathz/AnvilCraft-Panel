name: "Publish Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: Build and Publish Standalone (EXE + Auto-update)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "🔨 AnvilCraft Panel ${{ github.ref_name }}"
          releaseBody: "Versión oficial de AnvilCraft Panel. Incluye instalador EXE y paquete MSIX para la Store."
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"

      - name: Build MSIX (Custom Script)
        shell: pwsh
        run: |
          ./scripts/build-msix.ps1

      - name: Upload MSIX to same Release
        uses: softprops/action-gh-release@v1
        with:
          files: AnvilCraft.msix
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
