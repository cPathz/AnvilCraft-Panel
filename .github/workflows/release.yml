name: "Publish Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "standalone"
          - platform: "windows-latest"
            target: "msix"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: Build Tauri Binary
        run: npm run tauri build -- --no-bundle

      - name: Build and Sign MSIX
        if: matrix.target == 'msix'
        shell: pwsh
        run: |
          ./scripts/build-msix.ps1

      - uses: tauri-apps/tauri-action@v0
        if: matrix.target == 'standalone'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v.__VERSION__
          releaseName: "🔨 AnvilCraft Panel v.__VERSION__"
          releaseBody: |
            ### 🚀 Nueva Versión Disponible
            
            Esta entrega incluye las últimas mejoras de AnvilCraft Panel.
            
            #### 📦 Distribución
            - **Instalador Estándar (.exe)**: Para uso tradicional fuera de la tienda.
            - **Microsoft Store**: Disponible próximamente en la tienda oficial (usa el paquete MSIX si eres beta tester).
            
            ---
            > ⚠️ **Beta release** — This software is under active development.
            
            ## 🔄 Auto-update
            Si ya tienes AnvilCraft instalado, detectará esta actualización automáticamente.
            
            ## 💬 Community
            Únete a nuestro Discord: **discord.gg/E4PFVUe8vz**
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"

      - name: Upload MSIX to Release
        if: matrix.target == 'msix'
        uses: softprops/action-gh-release@v1
        with:
          files: AnvilCraft.msix
          tag_name: v0.1.11 # Forzamos el tag para que lo encuentre o cree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
